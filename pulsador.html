<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulsador ACTC</title>
<style>
:root{
  --fondo:#0B0C0E; --card:#17181C; --borde:#34363E; --badge:#2A2C33;
  --gris:#9A9CA4; --verde:#1DB954; --verde-osc:#0E7B37;
  --rojo:#E03131; --rojo-osc:#7A1512; --ambar:#F0A400; --oro:#F2C14E;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--fondo);font-family:Arial,Helvetica,sans-serif;color:#fff;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px}
body.doc{overflow:hidden}
body.alu{overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

/* ═══════════════════ PANTALLAS DEL ALUMNO (y de inicio) ═══════════════════ */
.alu #app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
  padding:20px 16px 24px;gap:18px}
.alu .marca{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto}
.alu .marca img{height:46px;width:auto;display:block}
.alu .marca .rot{text-align:right;line-height:1.3}
.alu .marca .rot b{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.alu .marca .rot span{display:block;font-size:12px;color:var(--gris)}
.alu h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
.alu h2{font-size:19px;line-height:1.25}
.alu p.sub{color:var(--gris);font-size:15px;line-height:1.45;max-width:62ch}
.alu .centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:0}
.alu label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gris);font-weight:700;margin-bottom:8px}
.alu input[type=text]{width:100%;background:var(--card);border:1.5px solid var(--borde);border-radius:12px;
  color:#fff;font-family:inherit;font-size:20px;padding:16px 14px;outline:none}
.alu input[type=text]:focus{border-color:var(--verde)}
.alu input.codigo{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}
.alu button{font-family:inherit;cursor:pointer;border-radius:12px;font-size:16px;
  padding:14px 18px;background:var(--card);border:1.5px solid var(--borde);color:#fff;touch-action:manipulation}
.alu button:hover{border-color:#5A5E6A}
.alu button.pri{background:var(--verde);border-color:var(--verde);color:#06140C;font-weight:700}
.alu button.fantasma{background:transparent;color:var(--gris)}
.alu button[disabled]{opacity:.45;cursor:default}
.alu .fila{display:flex;gap:10px;flex-wrap:wrap}
.alu .pulsar{width:100%;aspect-ratio:1/1;max-height:52vh;max-width:min(100%,420px);margin:0 auto;
  border-radius:50%;font-size:40px;font-weight:700;letter-spacing:.04em;
  background:var(--verde);border:none;color:#06140C;
  box-shadow:0 0 0 10px rgba(29,185,84,.16), 0 18px 40px rgba(0,0,0,.5);
  transition:transform .06s, box-shadow .18s, background .18s}
.alu .pulsar:active{transform:scale(.97)}
.alu .pulsar[disabled]{background:#2A2C33;color:#6A6E78;box-shadow:none;opacity:1}
.alu .pulsar.espera{background:#2A2C33;color:var(--gris);box-shadow:none}
.alu .puesto{text-align:center}
.alu .puesto .n{font-size:84px;font-weight:700;line-height:1;letter-spacing:-.04em}
.alu .puesto .n.top{color:var(--verde)}
.alu .puesto .t{font-size:17px;color:var(--gris);margin-top:8px}
.alu .estado{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris)}
.alu .nota{font-size:13px;color:var(--gris);line-height:1.5}
.alu pre{background:#101216;border:1.5px solid var(--borde);border-radius:12px;padding:14px;
  overflow-x:auto;font-size:12px;line-height:1.5;color:#D6D8DE}
.alu ol.pasos{margin-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
.alu ol.pasos code{background:#101216;border:1px solid var(--borde);border-radius:6px;padding:1px 6px;font-size:13px}
@media (min-width:760px){
  .alu #app{padding:28px 40px 34px;max-width:1100px;margin:0 auto;width:100%}
  .alu h1{font-size:44px}
  .alu .marca img{height:56px}
}
.luz{width:9px;height:9px;border-radius:50%;background:var(--gris);flex:0 0 auto;display:inline-block}
.luz.ok{background:var(--verde)}
.luz.mal{background:var(--rojo)}
.qrcaja{background:#fff;padding:14px;border-radius:14px;display:inline-block;line-height:0}
.qrcaja img{display:block;width:100%;height:auto;image-rendering:pixelated}

/* QR a pantalla completa */
#qrpleno{position:fixed;inset:0;z-index:90;background:var(--fondo);
  display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.qrpleno-caja{display:flex;flex-direction:column;align-items:center;gap:1.6vh}
.qrpleno-caja .qrcaja{width:min(48vh,80vw);padding:2vh}
.qrpleno-cod{font-size:min(10vh,17vw);font-weight:700;letter-spacing:.12em;color:var(--oro);line-height:1}
.qrpleno-o{font-size:min(3vh,20px);color:var(--gris);text-align:center;margin-top:-.8vh}
.qrpleno-dir{font-size:min(5.4vh,34px);font-weight:700;color:#fff;text-align:center;
  overflow-wrap:anywhere;line-height:1.15;max-width:92vw}
#qrpleno button{font-family:inherit;cursor:pointer;border-radius:12px;font-size:16px;
  padding:12px 18px;background:var(--card);border:1.5px solid var(--borde);color:#fff}

/* ═══════════════════ PRESENTACIÓN DEL PROFE ═══════════════════ */
.hoja{position:absolute;inset:0;display:none;flex-direction:column;padding:3vh 4vw 1.8vh;z-index:1}
.hoja.activa{display:flex}

.cab{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex:0 0 auto}
.cab img{height:9vh;width:auto;display:block}
.cab-txt{text-align:right;line-height:1.35;padding-right:4.4vh}
.cab-txt b{display:block;font-size:2.6vh;font-weight:700}
.cab-txt span{display:block;font-size:1.8vh;color:var(--gris)}
.cab-txt b.resp{color:var(--verde)}

.preg{font-size:3.4vh;font-weight:700;line-height:1.2;margin:2.4vh 0 0;max-width:94%;flex:0 0 auto}

.cuerpo{flex:1;display:flex;gap:2.4vw;min-height:0;margin:1.6vh 0}
.opciones{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.3vh;min-height:0}
.opciones.muchas{gap:.85vh}
.op{display:flex;align-items:center;gap:2vw;background:var(--card);
  border:1.5px solid var(--borde);border-radius:1.4vh;padding:1.7vh 2.2vw;
  transition:background .25s,border-color .25s,opacity .25s}
.badge{flex:0 0 auto;width:5vh;height:5vh;border-radius:50%;background:var(--badge);
  display:flex;align-items:center;justify-content:center;font-size:2.4vh;font-weight:700}
.txt{font-size:2.05vh;line-height:1.3}
.opciones.muchas .op{padding:1.1vh 2.2vw;border-radius:1.1vh}
.opciones.muchas .badge{width:4vh;height:4vh;font-size:1.9vh}
.opciones.muchas .txt{font-size:1.8vh}
.op.bien{background:var(--verde);border-color:var(--verde)}
.op.bien .badge{background:#fff;color:var(--verde-osc)}
.op.bien .txt{font-weight:700}
.op.mal{background:var(--rojo);border-color:var(--rojo)}
.op.mal .badge{background:#fff;color:var(--rojo-osc)}
.op.mal .txt{font-weight:700}
.op.apagada{opacity:.4}

/* gráfico de la pregunta */
.figura{flex:0 0 46%;display:flex;flex-direction:column;justify-content:center;gap:.8vh;min-height:0}
.figura .lienzo{background:#fff;border-radius:1.2vh;padding:1vh;min-height:0;display:flex;
  align-items:center;justify-content:center;overflow:hidden}
.figura img{display:block;max-width:100%;max-height:44vh;width:auto;height:auto}
.figura .epi{font-size:1.45vh;color:var(--gris);line-height:1.35}

/* ---- franja de alumnos ---- */
.alumnos{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;flex:0 0 auto;margin-bottom:1vh;
  padding-top:8.6vh;margin-top:-8.6vh;align-items:end}
.al{position:relative;background:#121317;border:1.5px solid #2E3038;border-radius:1.1vh;
  padding:.9vh 1vw;display:flex;align-items:center;gap:.9vw;
  transition:background .25s,border-color .25s}
.al .datos{flex:1;min-width:0}
.al .rot{font-size:1.15vh;letter-spacing:.14em;color:var(--gris);font-weight:700;display:block;margin-bottom:.25vh;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al .rot .dif{letter-spacing:.04em;font-weight:400}
.al input{width:100%;background:transparent;border:none;border-bottom:1.5px solid #34363E;
  color:#fff;font-family:inherit;font-size:1.95vh;font-weight:700;padding:.15vh 0;outline:none}
.al input::placeholder{color:#5A5E6A;font-weight:400}
.al input:focus{border-bottom-color:var(--ambar)}
.al .nomfijo{font-size:1.95vh;font-weight:700;padding:.15vh 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al.llego{border-color:#4A4E58}
.al.llego .orden{background:var(--ambar);color:#12161A;border-color:var(--ambar)}
.letras{display:flex;gap:.35vw;flex:0 0 auto}
.letras button,.letras span{width:3.3vh;height:3.3vh;border-radius:.6vh;background:var(--badge);
  border:1.5px solid #3A3D45;color:var(--gris);font-family:inherit;font-size:1.6vh;
  font-weight:700;cursor:pointer;padding:0;transition:all .15s;display:flex;align-items:center;justify-content:center}
.letras span{cursor:default}
.letras button:hover{border-color:#6A6E78;color:#fff}
.letras .sel,.letras button.sel:hover{background:#fff;color:#12161A;border-color:#fff}
.al.gana{background:var(--verde);border-color:var(--verde);box-shadow:0 0 0 3px rgba(29,185,84,.35)}
.al.gana .rot{color:#C9F0DA}
.al.acerto{background:transparent;border-color:var(--verde)}
.al.acerto .rot,.al.acerto .nomfijo,.al.acerto .veredicto{color:var(--verde)}
.al.fallo{background:var(--rojo);border-color:var(--rojo)}
.al.fallo .rot{color:#F6CFCB}
.al.nada{opacity:.45}
.al.acerto .letras .sel{background:var(--verde);color:#fff;border-color:var(--verde)}
.al.gana .letras span:not(.sel),.al.fallo .letras span:not(.sel),.al.acerto .letras span:not(.sel){opacity:.3}
.veredicto{font-size:2.1vh;font-weight:700;flex:0 0 auto;width:4.2vh;text-align:center;line-height:1.05}
.veredicto small{display:block;font-size:1.1vh;letter-spacing:.06em}
.orden{position:absolute;top:-.9vh;left:.7vw;background:#2E3038;color:var(--gris);
  font-size:1.1vh;font-weight:700;letter-spacing:.08em;padding:.15vh .5vw;border-radius:.5vh;border:1px solid #3A3D45}
.al.gana .orden{background:#0E7B37;color:#fff;border-color:#0E7B37}
.al.acerto .orden{background:#12161A;color:var(--verde);border-color:var(--verde)}
.al.fallo .orden{background:#7A1512;color:#fff;border-color:#7A1512}

/* corona de laurel sobre el ganador */
.al .corona{display:none}
.al.gana .corona{display:block;position:absolute;left:50%;top:-8.2vh;
  transform:translateX(-50%);width:10.5vh;height:auto;z-index:3;
  filter:drop-shadow(0 .4vh .8vh rgba(0,0,0,.6));
  animation:caerCorona .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes caerCorona{
  0%{opacity:0;transform:translateX(-50%) translateY(-3.5vh) scale(.45) rotate(-22deg)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1) rotate(0)}}

/* ---- lámina PULSADOR ---- */
.pulsa-cuerpo{flex:1;display:flex;gap:4vw;min-height:0;margin:2.4vh 0 1.4vh;align-items:center}
.pulsa-izq{flex:0 0 38%;display:flex;flex-direction:column;gap:2vh}
.pulsa-izq .numg{font-size:2vh;font-weight:700;letter-spacing:.42em;color:var(--ambar);text-transform:uppercase}
.pulsa-izq .enun{font-size:3.6vh;font-weight:700;line-height:1.22}
.pulsa-izq .llamado{display:flex;align-items:center;gap:1.2vw;font-size:2.2vh;color:var(--gris)}
.pulsa-izq .punto{width:2.2vh;height:2.2vh;border-radius:50%;background:var(--verde);flex:0 0 auto;
  box-shadow:0 0 0 0 rgba(29,185,84,.6);animation:latido 1.4s infinite}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(29,185,84,.55)}100%{box-shadow:0 0 0 1.8vh rgba(29,185,84,0)}}
.pulsa-izq .total{font-size:2vh;color:var(--gris)}
.pulsa-izq .total b{font-size:5vh;color:#fff;display:block;line-height:1}
.tablero{flex:1;display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.pf{display:flex;align-items:center;gap:1.4vw;background:var(--card);border:1.5px solid var(--borde);
  border-radius:1.6vh;padding:1.6vh 1.6vw;animation:aparecer .35s both}
.pf .pos{flex:0 0 auto;width:6vh;height:6vh;border-radius:50%;background:#3A3D45;display:flex;
  align-items:center;justify-content:center;font-size:2.6vh;font-weight:700}
.pf .nom{flex:1;font-size:3.4vh;font-weight:700;overflow-wrap:anywhere}
.pf .dif{font-size:2vh;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
.pf.p1{border-color:var(--verde);background:rgba(29,185,84,.12)}
.pf.p1 .pos{background:var(--verde);color:#06140C;width:7.4vh;height:7.4vh;font-size:3.2vh}
.pf.p1 .nom{font-size:5vh}
.pf.resto{padding:1vh 1.6vw;opacity:.7}
.pf.resto .pos{width:4.4vh;height:4.4vh;font-size:1.9vh}
.pf.resto .nom{font-size:2.4vh;font-weight:400}
.tablero .vacio{border:1.5px dashed var(--borde);border-radius:1.6vh;padding:6vh 2vw;text-align:center;
  color:var(--gris);font-size:2.4vh}
@media (max-width:900px){ .pulsa-cuerpo{flex-direction:column;align-items:stretch;overflow-y:auto} }

/* ---- lámina de respuesta ---- */
.preg-chica{font-size:2vh;color:var(--gris);font-style:italic;line-height:1.35;margin-top:1.6vh;max-width:94%;flex:0 0 auto}
.resp-cuerpo{flex:1;display:flex;gap:2.6vw;min-height:0;margin:1.8vh 0 1.2vh}
.resp-izq{flex:1 1 52%;display:flex;flex-direction:column;justify-content:center;gap:1vh;min-height:0}
.resp-izq .opciones{flex:0 0 auto;gap:.8vh}
.resp-izq .op{padding:1.1vh 1.6vw;border-radius:1.1vh}
.resp-izq .badge{width:4vh;height:4vh;font-size:1.9vh}
.resp-izq .txt{font-size:1.85vh}
.resp-izq .opciones.muchas .op{padding:.7vh 1.6vw}
.resp-izq .opciones.muchas .badge{width:3.4vh;height:3.4vh;font-size:1.6vh}
.resp-izq .opciones.muchas .txt{font-size:1.65vh}
.porque{flex:1 1 48%;align-self:center;max-height:100%;overflow-y:auto;display:flex;flex-direction:column;justify-content:center;gap:1.4vh;min-height:0;
  border-left:.5vh solid var(--ambar);padding-left:2vw}
.porque .rotp{font-size:1.6vh;font-weight:700;letter-spacing:.32em;color:var(--ambar)}
.porque p{font-size:2.15vh;line-height:1.5;color:#E3E5EA}
.porque p.largo{font-size:1.85vh}
.porque .cifras{display:flex;gap:1.2vw;flex-wrap:wrap}
.porque .cifra{flex:1;min-width:12vw;background:var(--card);border:1.5px solid var(--borde);border-radius:1.2vh;padding:1.4vh 1.2vw}
.porque .cifra b{display:block;font-size:3.6vh;line-height:1.05;color:#fff}
.porque .cifra span{display:block;font-size:1.5vh;color:var(--gris);margin-top:.5vh;line-height:1.3}
.alumnos.res{padding-top:7.6vh;margin-top:0}
.sinmano{font-size:1.6vh;color:var(--gris);font-style:italic}

/* ---- pie ---- */
.pie{display:flex;align-items:center;justify-content:space-between;gap:1vw;flex:0 0 auto;
  font-size:1.5vh;color:var(--gris);min-height:4.4vh}
.pie .cuantos{font-weight:700}
.pie .cuantos b{color:var(--ambar)}
.pie .nav{display:flex;align-items:center;gap:.8vw}
.pie button,.navfija button,.chip button{background:transparent;border:1px solid #3A3D45;color:var(--gris);
  border-radius:.7vh;cursor:pointer;font-family:inherit;font-size:1.5vh;padding:.65vh 1.1vw;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pie button:hover,.navfija button:hover,.chip button:hover{background:#22242A;color:#fff;border-color:#5A5E6A}
.pie .principal{background:var(--ambar);border-color:var(--ambar);color:#12161A;font-weight:700}
.pie .principal:hover{background:#FFC33D;border-color:#FFC33D;color:#12161A}
.pie .cuenta,.navfija .cuenta{min-width:5vw;text-align:center}

.navfija{position:absolute;right:4vw;bottom:3.2vh;z-index:5;
  display:flex;align-items:center;gap:1.2vw;font-size:1.5vh;color:var(--gris)}
.navfija button{font-size:2vh;padding:.8vh 2vw}
.pista{position:absolute;left:0;right:0;bottom:8.5vh;text-align:center;
  font-size:1.5vh;color:#5A5E6A;letter-spacing:.06em;pointer-events:none}

/* chip de la sala, siempre a mano abajo a la izquierda */
.chip{position:fixed;left:50%;top:1.6vh;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:.7vw;
  font-size:1.5vh;color:var(--gris);background:rgba(11,12,14,.85);border:1px solid #2E3038;
  border-radius:.8vh;padding:.45vh .6vw .45vh .8vw}
.chip b{color:var(--oro);letter-spacing:.12em}
.chip button{padding:.4vh .7vw;font-size:1.35vh}
body.editando .chip{display:none}

/* ================= CARTEL DE GANADOR ================= */
#ganador{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(6,7,9,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#ganador.ver{display:flex}
.trofeo{position:relative;text-align:center;background:#101216;border:2px solid var(--verde);
  border-radius:2vh;padding:0 0 4.5vh;min-width:52vw;max-width:86vw;overflow:hidden;
  box-shadow:0 0 0 .6vh rgba(29,185,84,.22), 0 3vh 7vh rgba(0,0,0,.65);
  animation:entrar .5s cubic-bezier(.16,1.05,.3,1) both}
@keyframes entrar{0%{transform:scale(.62) translateY(4vh);opacity:0}62%{transform:scale(1.04) translateY(0);opacity:1}100%{transform:scale(1)}}
.cuadros{height:3.2vh;
  background-image:conic-gradient(#fff 90deg,#0E1013 90deg 180deg,#fff 180deg 270deg,#0E1013 270deg);
  background-size:3.2vh 3.2vh;animation:ondear 1.5s linear infinite}
.cuadros.abajo{position:absolute;left:0;right:0;bottom:0;animation-direction:reverse}
@keyframes ondear{from{background-position:0 0}to{background-position:6.4vh 0}}
.trofeo .rotulo{display:block;margin:3.4vh 0 .8vh;font-size:2.1vh;font-weight:700;letter-spacing:.42em;
  color:var(--verde);text-transform:uppercase;animation:aparecer .45s .18s both}
.trofeo .nombre{display:block;font-size:9.5vh;font-weight:700;line-height:1;letter-spacing:-.02em;
  padding:0 5vw;word-break:break-word;animation:aparecer .45s .3s both}
.trofeo .detalle{display:block;margin-top:1.6vh;font-size:2vh;color:var(--gris);animation:aparecer .45s .42s both}
.trofeo .detalle b{color:#fff}
@keyframes aparecer{from{opacity:0;transform:translateY(1.6vh)}to{opacity:1;transform:none}}
.trofeo::after{content:"";position:absolute;top:0;bottom:0;width:36%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.13),transparent);
  transform:skewX(-18deg);animation:destello 1.15s .35s ease-out both}
@keyframes destello{from{left:-45%}to{left:125%}}
.trofeo .cerrar{position:absolute;right:1.4vw;top:4.4vh;background:transparent;border:none;color:#5A5E6A;
  font-size:2.4vh;cursor:pointer;line-height:1;padding:.4vh .8vw}
.trofeo .cerrar:hover{color:#fff}
.champan{width:23vh;height:auto;margin:1.2vh auto -.6vh;display:block}
.champan .corcho{animation:volarCorcho .85s .25s cubic-bezier(.2,.9,.4,1) both}
@keyframes volarCorcho{0%{transform:translate(-14px,16px) rotate(0);opacity:0}35%{opacity:1}100%{transform:translate(16px,-14px) rotate(48deg);opacity:0}}
.champan .chorro path{stroke-dasharray:160;stroke-dashoffset:160;animation:brotar .7s .3s ease-out forwards}
.champan .chorro path:nth-child(2){animation-delay:.4s}
.champan .chorro path:nth-child(3){animation-delay:.5s}
@keyframes brotar{to{stroke-dashoffset:0}}
.champan .gotas circle{opacity:0;animation:salpicar .9s .45s ease-out forwards}
.champan .gotas circle:nth-child(2){animation-delay:.55s}
.champan .gotas circle:nth-child(3){animation-delay:.5s}
.champan .gotas circle:nth-child(4){animation-delay:.62s}
.champan .gotas circle:nth-child(5){animation-delay:.7s}
@keyframes salpicar{0%{opacity:0;transform:scale(.2)}45%{opacity:1}100%{opacity:0;transform:scale(1.5)}}

/* ================= LÁMINA DE TEMA ================= */
.portada{justify-content:center;align-items:flex-start;padding:0 8vw}
.portada .franja{width:9vw;height:.9vh;background:var(--verde);border-radius:.5vh;margin-bottom:3.4vh}
.portada .modulo{font-size:2vh;font-weight:700;letter-spacing:.42em;color:var(--verde);text-transform:uppercase;margin-bottom:1.6vh}
.portada h1{font-size:13vh;font-weight:700;line-height:.92;letter-spacing:-.025em;text-transform:uppercase;margin-bottom:2.4vh}
.portada .bajada{font-size:2.9vh;color:var(--gris);line-height:1.35;max-width:62vw}
.portada .cuantas{margin-top:4.2vh;display:inline-flex;align-items:center;gap:1vw;
  border:1.5px solid #34363E;border-radius:1.2vh;padding:1.2vh 1.8vw;font-size:2vh;color:var(--gris)}
.portada .cuantas b{font-size:3.4vh;color:#fff;line-height:1}
.portada .logoesq{position:absolute;left:8vw;top:5vh;height:9vh;width:auto}

/* ================= CARÁTULA ================= */
.caratula{justify-content:center;align-items:center;text-align:center;padding:0 8vw}
.caratula img.logo{height:11vh;width:auto;margin-bottom:3vh}
.caratula .rotulo{font-size:2.3vh;font-weight:700;letter-spacing:.5em;color:var(--verde);text-transform:uppercase;margin-bottom:1.8vh}
.caratula h1{font-size:10.5vh;font-weight:700;line-height:.95;letter-spacing:-.025em;text-transform:uppercase;margin-bottom:1.2vh}
.caratula .lugar{font-size:4.6vh;font-weight:700;color:var(--oro);letter-spacing:.02em;margin-bottom:3vh}
.caratula .cinta{width:46vw;height:3vh;border-radius:.4vh;overflow:hidden;
  background-image:conic-gradient(#fff 90deg,#0E1013 90deg 180deg,#fff 180deg 270deg,#0E1013 270deg);
  background-size:1.5vh 1.5vh;margin-bottom:3vh;box-shadow:0 0 0 1px #2E3038}
.caratula .datos{display:flex;gap:2.4vw;font-size:1.9vh;color:var(--gris)}
.caratula .datos b{color:#fff}
.caratula .entrar{margin-top:3.4vh;display:flex;align-items:center;gap:2vw;text-align:left;
  background:#101216;border:1.5px solid #2E3038;border-radius:1.6vh;padding:1.6vh 2vw 1.6vh 1.6vh}
.caratula .entrar .qrcaja{width:19vh;padding:1.1vh;border-radius:1vh}
.caratula .entrar .t1{font-size:1.7vh;letter-spacing:.2em;color:var(--gris);font-weight:700;text-transform:uppercase}
.caratula .entrar .t2{font-size:2.3vh;font-weight:700;margin:.6vh 0 1.4vh;overflow-wrap:anywhere}
.caratula .entrar .t3{font-size:1.7vh;color:var(--gris)}
.caratula .entrar .cod{display:block;font-size:6.4vh;font-weight:700;letter-spacing:.14em;color:var(--oro);line-height:1;margin-top:.4vh}

@media (max-width:900px){
  .alumnos{grid-template-columns:1fr;gap:.6vh}
  .preg{font-size:2.7vh}
  .cuerpo,.resp-cuerpo{flex-direction:column;overflow-y:auto}
  .figura{flex:0 0 auto}
  .porque{border-left:none;padding-left:0;border-top:.4vh solid var(--ambar);padding-top:1.2vh}
}
@media (max-width:820px){
  .navfija{right:5vw;gap:3vw}
  .navfija button{font-size:2.6vh;padding:1.2vh 5vw}
  .navfija .cuenta{min-width:14vw;font-size:1.9vh}
  .pie{flex-wrap:wrap}
  .pie .cuantos{padding-left:0}
  .pie button{padding:1vh 2.4vw;font-size:1.8vh}
  .caratula{padding:0 6vw}
  .caratula h1{font-size:6.2vh;line-height:1.03}
  .caratula img.logo{height:8vh;margin-bottom:2vh}
  .caratula .lugar{font-size:3.2vh;margin-bottom:2vh}
  .portada{padding:0 6vw}
  .portada h1{font-size:6.6vh;line-height:1}
  .portada .bajada{font-size:2.1vh;max-width:none}
  .portada .logoesq{left:6vw;top:4vh;height:6.5vh}
  .pista{bottom:10.5vh;font-size:1.7vh;padding:0 6vw}
}
@media (prefers-reduced-motion:reduce){
  .trofeo,.trofeo .rotulo,.trofeo .nombre,.trofeo .detalle,.cuadros,.al.gana .corona,
  .champan .corcho,.champan .chorro path,.champan .gotas circle{animation:none}
  .trofeo::after{display:none}
  .champan .chorro path{stroke-dashoffset:0}
  .champan .gotas circle{opacity:1}
}

/* ================= EDITOR ================= */
#btnEditar{position:fixed;right:1.1vw;top:1.3vh;z-index:40;width:3.6vh;height:3.6vh;display:none;
  align-items:center;justify-content:center;background:rgba(23,24,28,.75);border:1px solid #2E3038;color:#5A5E6A;
  border-radius:50%;cursor:pointer;font-family:inherit;font-size:1.7vh;padding:0;opacity:.45;
  transition:opacity .18s,color .18s,border-color .18s}
body.doc #btnEditar{display:flex}
#btnEditar:hover{opacity:1;background:#22242A;color:#fff;border-color:#5A5E6A}

#editor{position:fixed;inset:0;z-index:60;display:none;background:#0B0C0E;overflow:auto;padding:3vh 4vw}
#editor.ver{display:block}

#editor .barra{display:flex;gap:.8vw;flex-wrap:wrap;margin-bottom:2.6vh}
#editor button{font-family:inherit;cursor:pointer;border-radius:.7vh;font-size:1.6vh;
  padding:.9vh 1.4vw;border:1px solid #3A3D45;background:#17181C;color:#E9ECEF}
#editor button:hover{background:#22242A;border-color:#5A5E6A}
#editor button.pri{background:var(--verde);border-color:var(--verde);color:#06140C;font-weight:700}
#editor button.baja{background:#17181C;border-color:#5A2A26;color:#E08C84}
.mod{border:1px solid #2E3038;border-radius:1.1vh;margin-bottom:1.8vh;overflow:hidden}
.mod .cabm{display:flex;align-items:center;gap:1vw;background:#131418;padding:1.2vh 1.4vw;flex-wrap:wrap}
.mod .cabm b{font-size:2.1vh}
.mod .cabm .baj{flex:1;color:var(--gris);font-size:1.6vh;min-width:12vw}
.mod ol{list-style:none;padding:.6vh 1.4vw 1.4vh;margin:0}
.mod li{display:flex;align-items:center;gap:.9vw;padding:.9vh 0;border-bottom:1px solid #1E2025;flex-wrap:wrap}
.mod li:last-child{border-bottom:none}
.mod li .txtp{flex:1;font-size:1.75vh;min-width:20vw}
.mod li .badgeq{background:#2A2C33;color:var(--gris);border-radius:.5vh;padding:.3vh .7vw;font-size:1.35vh;font-weight:700;letter-spacing:.06em}
.mod li .ok{color:var(--verde);font-weight:700;font-size:1.5vh}
.mod li .falta{color:#E08C84;font-size:1.3vh}
#form{position:fixed;inset:0;z-index:70;display:none;background:rgba(6,7,9,.85);
  align-items:center;justify-content:center;padding:3vh 4vw;overflow:auto}
#form.ver{display:flex}
#form .caja{background:#101216;border:1px solid #2E3038;border-radius:1.4vh;
  padding:2.6vh 2.4vw;width:min(68vw,900px);max-height:92vh;overflow:auto}
#form h3{font-size:2.6vh;margin-bottom:1.8vh}
#form label{display:block;font-size:1.4vh;letter-spacing:.1em;color:var(--gris);
  text-transform:uppercase;font-weight:700;margin:1.6vh 0 .5vh}
#form input[type=text],#form textarea{width:100%;background:#17181C;border:1px solid #34363E;border-radius:.7vh;
  color:#fff;font-family:inherit;font-size:1.8vh;padding:1vh 1vw;outline:none}
#form input:focus,#form textarea:focus{border-color:var(--verde)}
#form textarea{min-height:8vh;resize:vertical}
#form textarea#fPorque{min-height:12vh}
#form button{font-family:inherit;cursor:pointer;border-radius:.7vh;font-size:1.6vh;
  padding:1vh 1.6vw;background:#17181C;border:1px solid #3A3D45;color:#D6D8DE}
#form button:hover{background:#22242A;border-color:#5A5E6A;color:#fff}
#form button.pri{background:var(--verde);border-color:var(--verde);color:#06140C;font-weight:700}
#form button.baja{background:#17181C;border-color:#5A2A26;color:#E08C84}
.fila-op{display:flex;align-items:center;gap:.8vw;margin-bottom:.7vh}
.fila-op input[type=radio]{width:2.2vh;height:2.2vh;accent-color:#1DB954;flex:0 0 auto;cursor:pointer}
.fila-op .letra{width:2.4vh;font-weight:700;color:var(--gris);flex:0 0 auto}
.fila-op input[type=text]{flex:1}
.fila-op button{flex:0 0 auto;padding:.7vh 1vw}
.fimg{display:flex;align-items:center;gap:1vw;flex-wrap:wrap;font-size:1.6vh;color:var(--gris)}
.fimg img{height:9vh;width:auto;background:#fff;border-radius:.6vh;padding:.4vh}
#form .pieform{display:flex;gap:.8vw;margin-top:2.4vh;flex-wrap:wrap}
#form .aviso{font-size:1.5vh;color:#E08C84;margin-top:1vh;min-height:2vh}
</style>
</head>

<div id="app"></div>

<div id="editor">
  <h2>Editor de preguntas</h2>
  <p class="sub">Agregá, cambiá o borrá preguntas. Cuando termines, descargá el archivo actualizado y subilo a GitHub con el nombre <b>pulsador.html</b>.</p>

    <button type="button" class="pri" id="edDescargar">⬇ Descargar archivo actualizado</button>

</div>

<div id="form"><div class="caja" id="formCaja"></div></div>

</div>

      "7/8 de pulgada.",

     ],
     "correcta": 0,
     "porque": "La presión es fuerza dividida superficie. Con el mismo esfuerzo en el pedal, cuanto más chico el diámetro de la bomba, menor es el área del pistón y mayor la presión que mandás al circuito. Se paga con más recorrido de pedal."
    },
    {
     "tema": "Frenos",
     "pregunta": "¿Cuál debe ser el elemento ubicado más alto en el sistema de frenos?",

      "Reservorio.",

     "correcta": 0,

    },
    {

    },
    {

     "porque": "El frenado no lo define el sistema de frenos solo. La carga aerodinámica define cuánto peso aplasta la cubierta contra el piso; el coeficiente de la cubierta define cuánta de esa carga se convierte en fuerza de frenado; y el de pastilla y disco define cuánto par podés generar. Si falla cualquiera de los tres, el auto no frena."

/* ---------- utilidades ---------- */
function esc(t){ return String(t==null?"":t)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function $(sel){ return app.querySelector(sel); }
function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function leerLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function parametro(n){
  var m = new RegExp("[?&]"+n+"=([^&]*)").exec(location.search);
  return m ? decodeURIComponent(m[1]) : "";
}
function codigoNuevo(){
  var letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = "";
  for (var i=0;i<4;i++) c += letras.charAt(Math.floor(Math.random()*letras.length));
  return c;
}
/* dirección pública del pulsador: el QR siempre lleva acá, aunque el archivo se abra desde otro lado */
var PUBLICA = "https://peter2514.github.io/actc-educacion/pulsador.html";
function enGitHub(){ return /^https?:$/.test(location.protocol) && /github\.io$/.test(location.hostname); }
function basePublica(){ return (enGitHub() || ENSAYANDO) ? location.origin + location.pathname : PUBLICA; }
function urlAlumno(sala){ return basePublica() + "?s=" + sala + (ENSAYANDO ? "&ensayo=1" : ""); }
function urlCorta(){ return basePublica().replace(/^[a-z]+:\/\//, "").replace(/^www\./, ""); }
function dibujarQR(destino, texto){
  try{
    var q = qrcode(0, "M"); q.addData(texto); q.make();
    destino.innerHTML = q.createImgTag(6, 0);
    var im = destino.querySelector("img");
    if (im){ im.style.width = "100%"; im.style.height = "auto"; im.alt = "Código QR"; }
    return true;
  }catch(e){ destino.innerHTML = ""; return false; }
}

/* ═══════════════ conexión con la base ═══════════════
   NUBE = Firebase por REST, sin librerías.
   ENSAYO = todo dentro de este navegador, para practicar.          */
var HORA = { ".sv": "timestamp" };

var NUBE = {
  escribir: function(ruta, valor){
    return fetch(BASE + "/" + ruta + ".json", {
      method:"PUT", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(valor)
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
      return r.json();
    });
  },
  leer: function(ruta){
    return fetch(BASE + "/" + ruta + ".json", { cache:"no-store" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
  },
  escuchar: function(ruta, cb){
    var url = BASE + "/" + ruta + ".json", muerto = false, fuente = null, reloj = null;
    function sondear(){
      fetch(url, { cache:"no-store" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(v){ if (!muerto) cb(v, true); })
        .catch(function(){ if (!muerto) cb(undefined, false); });
    }
    function aSondeo(){ if (reloj) return; sondear(); reloj = setInterval(sondear, 1500); }
    if (typeof EventSource !== "undefined"){
      try{
        fuente = new EventSource(url);
        var estado = null;
        fuente.addEventListener("put", function(ev){
          var d = JSON.parse(ev.data);
          estado = (d.path === "/") ? d.data : ponerEn(estado, d.path, d.data);
          if (!muerto) cb(estado, true);
        });
        fuente.addEventListener("patch", function(ev){
          var d = JSON.parse(ev.data);
          if (d.path === "/"){ estado = estado || {}; for (var k in d.data) estado[k] = d.data[k]; }
          else estado = ponerEn(estado, d.path, d.data);
          if (!muerto) cb(estado, true);
        });
        fuente.onerror = function(){
          if (fuente && fuente.readyState === 2){ try{ fuente.close(); }catch(e){} fuente = null; aSondeo(); }
        };
      }catch(e){ aSondeo(); }
    } else aSondeo();
    return function(){
      muerto = true;
      if (fuente) try{ fuente.close(); }catch(e){}
      if (reloj) clearInterval(reloj);
    };
  }
};
function ponerEn(estado, ruta, valor){
  var partes = ruta.split("/").filter(Boolean);
  if (!partes.length) return valor;
  if (estado == null || typeof estado !== "object") estado = {};
  var copia = clonar(estado), cur = copia;
  for (var i=0;i<partes.length-1;i++){
    var sig = cur[partes[i]];
    cur[partes[i]] = (sig && typeof sig === "object") ? clonar(sig) : {};
    cur = cur[partes[i]];
  }
  if (valor === null) delete cur[partes[partes.length-1]];
  else cur[partes[partes.length-1]] = valor;
  return copia;
}
function clonar(o){ var c = {}; for (var k in o) c[k] = o[k]; return c; }

var ENSAYO = (function(){
  var LLAVE = "pulsador.ensayo", oyentes = [];
  function todo(){ try{ return JSON.parse(leerLocal(LLAVE) || "{}"); }catch(e){ return {}; } }
  function bajar(obj, ruta){
    var p = ruta.split("/").filter(Boolean), cur = obj;
    for (var i=0;i<p.length;i++){ if (cur == null || typeof cur !== "object") return null; cur = cur[p[i]]; }
    return cur === undefined ? null : cur;
  }
  function avisar(){ var raiz = todo(); oyentes.forEach(function(o){ o.cb(bajar(raiz, o.ruta), true); }); }
  try{ window.addEventListener("storage", function(ev){ if (ev.key === LLAVE) avisar(); }); }catch(e){}
  return {
    escribir: function(ruta, valor){
      var raiz = todo();
      if (/^salas\/[^/]+\/pulsos\/[^/]+\/[^/]+$/.test(ruta) && bajar(raiz, ruta) != null)
        return Promise.reject(new Error("ya respondiste"));
      var v = (valor && valor[".sv"] === "timestamp") ? Date.now() : valor;
      if (v && typeof v === "object"){
        v = JSON.parse(JSON.stringify(v));
        for (var k in v) if (v[k] && v[k][".sv"] === "timestamp") v[k] = Date.now();
      }
      var p = ruta.split("/").filter(Boolean), cur = raiz;
      for (var i=0;i<p.length-1;i++){
        if (!cur[p[i]] || typeof cur[p[i]] !== "object") cur[p[i]] = {};
        cur = cur[p[i]];
      }
      cur[p[p.length-1]] = v;
      guardar(LLAVE, JSON.stringify(raiz));
      setTimeout(avisar, 0);
      return Promise.resolve(v);
    },
    leer: function(ruta){ return Promise.resolve(bajar(todo(), ruta)); },
    escuchar: function(ruta, cb){
      var o = { ruta:ruta, cb:cb };
      oyentes.push(o);
      setTimeout(function(){ cb(bajar(todo(), ruta), true); }, 0);
      return function(){ oyentes = oyentes.filter(function(x){ return x !== o; }); };
    }
  };
})();

/* ═══════════════════════ ALUMNO ═══════════════════════
   El alumno no queda escuchando: pregunta cada 3 o 4 segundos y corta,
   así el plan gratis de Firebase banca a toda la clase.               */
function pantallaAlumno(sala){
  var nombre = YO || leerLocal("pulsador.nombre") || "";
  if (!nombre) return pedirNombre(sala);
  var uid = miId();
  var ronda = null, yaPulse = false, podio = null, enviando = false, reloj = null, vivo = true;

  app.innerHTML = marca() +
    '<div class="centro">' +
      '<div style="text-align:center"><h2>Hola, ' + esc(nombre) + '</h2>' +
        '<p class="sub" id="pie" style="margin:8px auto 0;text-align:center">Buscando la sala…</p></div>' +
      '<button class="pulsar espera" id="boton" disabled>ESPERÁ</button>' +
      '<div class="puesto" id="puesto"></div>' +
    '</div>' +
    '<div class="estado"><span class="luz" id="luz"></span><span id="txtluz">Conectando…</span>' +
      '<span style="flex:1"></span>' +
      (YO ? '' : '<button class="fantasma" id="cambiar" style="padding:6px 10px;font-size:13px">Cambiar nombre</button>') +
    '</div>';

  if (!YO) $("#cambiar").addEventListener("click", function(){
    guardar("pulsador.nombre",""); vivo = false; if (reloj) clearTimeout(reloj); pedirNombre(sala);
  });
  var boton = $("#boton");
  boton.addEventListener("click", pulsar);

  function luz(ok){
    var l = $("#luz"), t = $("#txtluz"); if (!l) return;
    l.className = "luz " + (ok ? "ok" : "mal");
    t.textContent = ok ? ("Sala " + sala + (ENSAYANDO ? " · ensayo" : "")) : "Sin señal, reintentando…";
  }
  function otraVuelta(){ if (vivo) reloj = setTimeout(ciclo, 3000 + Math.floor(Math.random() * 1600)); }
  function ciclo(){
    if (!vivo) return;
    DB.leer("salas/" + sala + "/ronda").then(function(v){
      luz(true);
      if (v == null){
        $("#pie").textContent = "Esa sala no existe todavía.";
        boton.disabled = true; boton.className = "pulsar espera"; boton.textContent = "—";
        otraVuelta(); return;
      }
      if (v !== ronda){ ronda = v; yaPulse = false; podio = null; pintar(); }
      if (yaPulse && !podio){
        DB.leer("salas/" + sala + "/podio/" + ronda).then(function(pp){
          if (pp){ podio = pp; pintar(); } otraVuelta();
        }, function(){ otraVuelta(); });
        return;
      }
      pintar(); otraVuelta();
    }, function(){ luz(false); otraVuelta(); });
  }
  function miPuesto(){
    if (!podio) return 0;
    for (var k = 1; k <= 5; k++) if (podio[k] && podio[k].id === uid) return k;
    return -1;
  }
  function pintar(){
    if (ronda == null) return;
    var caja = $("#puesto");
    if (ronda === 0){                         /* el profe todavía no abrió ninguna pregunta */
      boton.disabled = true; boton.className = "pulsar espera"; boton.textContent = "ESPERÁ";
      $("#pie").textContent = "Ya estás adentro. Esperá a que arranque la primera pregunta.";
      caja.innerHTML = ""; return;
    }
    if (!yaPulse){
      boton.disabled = enviando; boton.className = "pulsar"; boton.textContent = enviando ? "…" : "RESPONDO";
      $("#pie").textContent = "Cuando sepas la respuesta, tocá el botón.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + '</div>';
      return;
    }
    boton.disabled = true; boton.className = "pulsar"; boton.textContent = "LISTO";
    var p = miPuesto();
    if (p === 0){
      $("#pie").textContent = "Mano levantada. Mirá la pantalla.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + ' · esperando el resultado</div>';
    } else if (p > 0){
      $("#pie").textContent = "¡Entraste en el podio!";
      caja.innerHTML = '<div class="n top">' + p + 'º</div>' +
        '<div class="t">' + (p === 1 ? '¡Fuiste el primero!' : 'Entraste ' + p + 'º.') + '</div>';
    } else {
      $("#pie").textContent = "Esta vez no llegaste. Va la próxima.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + ' · fuera del podio</div>';
    }
  }
  function pulsar(){
    if (enviando || ronda == null || ronda === 0 || yaPulse) return;
    enviando = true; pintar();
    DB.escribir("salas/" + sala + "/pulsos/" + ronda + "/" + uid, { n:nombre, t:HORA })
      .then(function(){ enviando = false; yaPulse = true; pintar(); })
      .catch(function(){ enviando = false; yaPulse = true; pintar(); });
  }
  ciclo();
}

/* ---- arma todas las láminas ---- */
function armar(){
  app.innerHTML = "";
  HOJAS = [];
  var nPreg = 0;
  MODULOS.forEach(function(m){ nPreg += m.preguntas.length; });
  var total = 1 + MODULOS.length + nPreg * 3;
  var num = 0;

  /* carátula */
  agregar(hojaCaratula(nPreg), { tipo:"caratula" }, total);

  MODULOS.forEach(function(m, mi){
    agregar(hojaPortada(m, mi), { tipo:"portada" }, total);
    m.preguntas.forEach(function(q){
      num++;
      if (!ESTADO[num]) ESTADO[num] = { manual:[false,false,false], nombres:["","",""], letras:[null,null,null] };
      agregar(hojaPulsador(m, q, num), { tipo:"pulsador", num:num, q:q, m:m }, total);
      agregar(hojaPregunta(m, q, num), { tipo:"pregunta", num:num, q:q, m:m }, total);
      agregar(hojaRespuesta(m, q, num), { tipo:"respuesta", num:num, q:q, m:m }, total);
    });
  });

  if (ACTUAL >= HOJAS.length) ACTUAL = 0;
  mostrar(ACTUAL, 0);
}

    b.addEventListener("click", function(ev){ ev.stopPropagation(); mover(+b.dataset.ir); });

}

      '<button type="button" class="principal" data-ver>Ver respuesta ▶</button>' +
    '</span></footer>');

  var st = ESTADO[num];
  s.querySelectorAll(".al").forEach(function(al, n){
    var inp = al.querySelector("input");
    inp.addEventListener("input", function(){ st.manual[n] = inp.value.trim() !== ""; st.nombres[n] = inp.value; });
    al.querySelectorAll(".letras button").forEach(function(b){
      b.addEventListener("click", function(){
        var l = +b.dataset.l;
        st.letras[n] = (st.letras[n] === l) ? null : l;
        pintarLetras(s, num);
      });
    });
  });

    pintarPregunta(num);
  });

    if (!confirm("¿Volver a abrir el pulsador para esta pregunta? Se borran las manos levantadas.")) return;
    ESTADO[num] = { manual:[false,false,false], nombres:["","",""], letras:[null,null,null] };

function pintarLetras(s, num){

    al.querySelectorAll(".letras button").forEach(function(b){
      b.classList.toggle("sel", st.letras[n] === +b.dataset.l);
    });
  });
}
/* completa las tres tarjetas con los primeros que levantaron la mano */
function pintarPregunta(num){
  pintarPulsador(num);
  var h = hojaDe("pregunta", num); if (!h) return;
  var s = h.el, st = ESTADO[num];
  var lista = PULSOS[RONDAS[num]] || [];
  var t0 = lista.length ? lista[0].t : 0;
  s.querySelectorAll(".al").forEach(function(al, n){
    var x = lista[n], inp = al.querySelector("input");
    if (!st.manual[n]){
      st.nombres[n] = x ? x.n : "";
      if (document.activeElement !== inp) inp.value = st.nombres[n];
    }
    al.classList.toggle("llego", !!(x || st.nombres[n]));
    al.querySelector(".dif").textContent = (x && n > 0) ? "  ·  +" + ((x.t - t0)/1000).toFixed(2).replace(".",",") + " s" : "";
  });
  pintarLetras(s, num);
  var c = s.querySelector(".cuantos");
  c.innerHTML = RONDAS[num] == null ? "Abriendo el pulsador…" :
    (lista.length ? '<b>' + lista.length + '</b> ' + (lista.length === 1 ? 'levantó la mano' : 'levantaron la mano') :
     'Pulsador abierto · esperando manos');
}

/* ---- lámina PULSADOR: los chicos levantan la mano ---- */
function hojaPulsador(m, q, num){
  var s = seccion("pulsador",

    '<div class="pulsa-cuerpo">' +
      '<div class="pulsa-izq">' +
        '<span class="numg">Pregunta ' + num + '</span>' +
        '<p class="enun">' + q.pregunta + '</p>' +
        '<div class="llamado"><span class="punto"></span><span class="estado">Abriendo el pulsador…</span></div>' +
        '<div class="total"></div>' +
      '</div>' +
      '<div class="tablero"></div>' +
    '</div>' +
    '<footer class="pie"><span class="cuantos"></span><span class="nav">' +
      '<button type="button" data-reabrir title="Borra las manos y vuelve a abrir el pulsador">↻ Reabrir pulsador</button>' +
      '<button type="button" data-ir="-1">◀</button><span class="cuenta"></span>' +
      '<button type="button" class="principal" data-ir="1">Ver pregunta ▶</button>' +

  s.querySelector("[data-reabrir]").addEventListener("click", function(){

    ESTADO[num] = { manual:[false,false,false], nombres:["","",""], letras:[null,null,null] };
    delete RONDAS[num];
    abrirRonda(num);
  });
  return s;
}
function pintarPulsador(num){
  var h = hojaDe("pulsador", num); if (!h) return;
  var s = h.el, lista = PULSOS[RONDAS[num]] || [];
  s.querySelector(".estado").textContent = RONDAS[num] == null ? "Abriendo el pulsador…" :
    "Pulsador abierto: tocá RESPONDO en el teléfono";
  s.querySelector(".total").innerHTML = lista.length ?
    '<b>' + lista.length + '</b>' + (lista.length === 1 ? 'levantó la mano' : 'levantaron la mano') : '';
  var caja = s.querySelector(".tablero");
  if (!lista.length){ caja.innerHTML = '<div class="vacio">Nadie levantó la mano todavía.</div>'; return; }
  var t0 = lista[0].t;
  caja.innerHTML = lista.slice(0,5).map(function(x, i){
    var dif = i === 0 ? "" : "+" + ((x.t - t0)/1000).toFixed(2).replace(".",",") + " s";
    return '<div class="pf ' + (i === 0 ? "p1" : i < 3 ? "" : "resto") + '"><span class="pos">' + (i+1) + 'º</span>' +
      '<span class="nom">' + esc(x.n) + '</span><span class="dif">' + dif + '</span></div>';
  }).join("") + (lista.length > 5 ? '<p class="sinmano">y ' + (lista.length - 5) + ' más.</p>' : '');

/* ---- lámina RESPUESTA: correcta, resultado de cada uno y porqué ---- */
function hojaRespuesta(m, q, num){
  var largo = (q.porque || "").length > 380 ? " largo" : "";
  var cifras = (q.datos && q.datos.length) ? '<div class="cifras">' + q.datos.map(function(d){
    return '<div class="cifra"><b>' + esc(d.v) + '</b><span>' + esc(d.t) + '</span></div>';
  }).join("") + '</div>' : '';

        (q.porque ? '<p class="' + largo + '">' + esc(q.porque) + '</p>' : '') + cifras + '</div>' : '') +
    '</div>' +

      '<button type="button" data-ir="-1">◀ Pregunta</button><span class="cuenta"></span>' +
      '<button type="button" data-ir="1">▶</button>' +
    '</span></footer>');
  return s;
}
/* calcula ganador / acertó / falló con lo cargado en la pregunta */
function resultado(num, q){
  var st = ESTADO[num], yaGano = false, filas = [];
  for (var n = 0; n < 3; n++){
    var nom = (st.nombres[n] || "").trim(), l = st.letras[n], v = "";
    if (l != null){
      if (l === q.correcta){ v = yaGano ? "acerto" : "gana"; yaGano = true; }
      else v = "fallo";
    }
    if (nom || l != null) filas.push({ n:n, nombre:nom || ("Alumno " + (n+1)), letra:l, v:v });
  }
  return filas;
}
function pintarRespuesta(num, q, festejo){
  var h = hojaDe("respuesta", num); if (!h) return;
  var s = h.el, filas = resultado(num, q);
  var elegidas = {};
  filas.forEach(function(f){ if (f.letra != null) elegidas[f.letra] = true; });
  s.querySelectorAll(".op").forEach(function(o){
    var i = +o.dataset.i;
    o.classList.remove("bien","mal","apagada");
    if (i === q.correcta) o.classList.add("bien");
    else if (elegidas[i]) o.classList.add("mal");
    else o.classList.add("apagada");
  });
  var caja = s.querySelector(".alumnos.res");
  if (!filas.length){
    caja.style.display = "block";
    caja.innerHTML = '<p class="sinmano">Nadie contestó esta pregunta.</p>';
  } else {
    caja.style.display = "";
    caja.innerHTML = filas.map(function(f){
      var letras = q.opciones.map(function(_, i){
        return '<span class="' + (f.letra === i ? "sel" : "") + '">' + LETRAS[i] + '</span>';
      }).join("");
      var ver = f.v === "gana" ? '★<small>GANA</small>' : f.v === "acerto" ? '✓<small>BIEN</small>' : f.v === "fallo" ? '✗' : '';
      return '<div class="al ' + (f.v || "nada") + '">' + CORONA +
        '<span class="orden">' + (f.n + 1) + 'º</span>' +
        '<div class="datos"><span class="rot">' + (f.v ? 'RESPONDIÓ ' + LETRAS[f.letra] : 'NO CONTESTÓ') + '</span>' +
        '<div class="nomfijo">' + esc(f.nombre) + '</div></div>' +
        '<div class="letras">' + letras + '</div><span class="veredicto">' + ver + '</span></div>';
    }).join("");
  }
  var g = filas.filter(function(f){ return f.v === "gana"; })[0];
  var c = s.querySelector(".cuantos");
  c.innerHTML = g ? 'Ganó <b>' + esc(g.nombre) + '</b>' :
    (filas.some(function(f){ return f.v; }) ? 'Nadie acertó' : '');
  if (festejo && g) festejar(g);
}

function hojaDe(tipo, num){
  for (var i = 0; i < HOJAS.length; i++) if (HOJAS[i].tipo === tipo && HOJAS[i].num === num) return HOJAS[i];
  return null;
}

/* ---- pulsador: una ronda por pregunta ---- */
function abrirRonda(num){
  if (RONDAS[num] != null){ escucharPulsos(num); return; }
  pintarPregunta(num);
  DB.leer("salas/" + SALA + "/ronda").then(function(v){
    var actual = (typeof v === "number") ? v : (RONDA_BASE || 0);
    /* si se puede, la ronda coincide con el número de pregunta que ven los chicos */
    var nueva = actual < num ? num : actual + 1;
    return DB.escribir("salas/" + SALA + "/ronda", nueva).then(function(){
      RONDA_BASE = nueva; RONDAS[num] = nueva; guardarSesion();
      escucharPulsos(num);
    });
  }).catch(function(){
    var h = hojaDe("pregunta", num);
    if (h) h.el.querySelector(".cuantos").textContent = "No pude abrir el pulsador. Revisá la conexión y tocá «Reabrir».";
  });
}
function escucharPulsos(num){
  var r = RONDAS[num];
  if (rondaEscuchada === r && cortarPulsos){ pintarPregunta(num); return; }
  dejarDeEscuchar();
  rondaEscuchada = r;
  cortarPulsos = DB.escuchar("salas/" + SALA + "/pulsos/" + r, function(p){
    if (p === undefined) return;                       /* sin conexión: dejamos lo último */
    PULSOS[r] = !p ? [] : Object.keys(p).map(function(k){ return { id:k, n:p[k].n, t:p[k].t }; })
      .sort(function(a,b){ return (a.t - b.t) || (a.id < b.id ? -1 : 1); });
    var h = HOJAS[ACTUAL];
    if (h && h.num === num){ if (h.tipo === "pregunta") pintarPregunta(num); if (h.tipo === "pulsador") pintarPulsador(num); }
  });
  pintarPregunta(num);
}
function dejarDeEscuchar(){ if (cortarPulsos) cortarPulsos(); cortarPulsos = null; rondaEscuchada = null; }

/* publica los cinco primeros para que cada teléfono vea si entró al podio */
function publicarPodio(num){
  var r = RONDAS[num], lista = PULSOS[r];
  if (r == null || !lista || !lista.length) return;
  var cinco = {};
  lista.slice(0,5).forEach(function(x, i){ cinco[i+1] = { id:x.id, n:x.n }; });
  DB.escribir("salas/" + SALA + "/podio/" + r, cinco).catch(function(){});
}

/* ---- navegación ---- */
function mostrar(n, d){
  cerrarGanador();
  HOJAS.forEach(function(h, i){ h.el.classList.toggle("activa", i === n); });
  var prev = ACTUAL;
  ACTUAL = n; guardarSesion();
  var h = HOJAS[n];
  if (h.tipo === "pulsador" || h.tipo === "pregunta") abrirRonda(h.num);
  else if (h.tipo === "respuesta"){
    var desdeSuPregunta = d === 1 && HOJAS[prev] && HOJAS[prev].tipo === "pregunta" && HOJAS[prev].num === h.num;
    if (desdeSuPregunta) publicarPodio(h.num);
    pintarRespuesta(h.num, h.q, desdeSuPregunta);
  }
  else dejarDeEscuchar();
}
function mover(d){
  var n = Math.max(0, Math.min(HOJAS.length - 1, ACTUAL + d));
  if (n !== ACTUAL) mostrar(n, d);
}

/* ---- cartel de ganador ---- */
var relojGanador = null;
function festejar(g){
  var cap = document.getElementById("ganador");
  document.getElementById("gNombre").textContent = g.nombre;
  document.getElementById("gDetalle").innerHTML =
    'Respondió <b>' + LETRAS[g.letra] + '</b> &nbsp;·&nbsp; levantó la mano ' + (g.n + 1) + 'º';
  var t = cap.querySelector(".trofeo"), ch = cap.querySelector(".champan");
  t.style.animation = "none"; if (ch) ch.style.display = "none";
  void t.offsetWidth;
  t.style.animation = ""; if (ch) ch.style.display = "";
  cap.classList.add("ver");
  clearTimeout(relojGanador);
  relojGanador = setTimeout(cerrarGanador, 3200);
}
function cerrarGanador(){
  clearTimeout(relojGanador);
  document.getElementById("ganador").classList.remove("ver");
}
document.getElementById("ganador").addEventListener("click", cerrarGanador);

/* ---- deslizar con el dedo ---- */
var tocX = 0, tocY = 0, tocando = false;
document.addEventListener("touchstart", function(e){
  if (!document.body.classList.contains("doc") || e.touches.length !== 1){ tocando = false; return; }
  tocX = e.touches[0].clientX; tocY = e.touches[0].clientY; tocando = true;
}, {passive:true});
document.addEventListener("touchend", function(e){
  if (!tocando) return;
  tocando = false;
  var t = e.target;
  if (t && t.closest && (t.closest("input") || t.closest("button") || t.closest(".op") || t.closest("#ganador") ||
      t.closest("#editor") || t.closest("#form") || t.closest("#qrpleno"))) return;
  var dx = e.changedTouches[0].clientX - tocX, dy = e.changedTouches[0].clientY - tocY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) mover(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---- teclado ---- */
document.addEventListener("keydown", function(ev){
  if (!document.body.classList.contains("doc") && !document.body.classList.contains("editando")) return;
  var esCampo = ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA");
  if (document.getElementById("editor").classList.contains("ver")){
    if (ev.key === "Escape" && !document.getElementById("form").classList.contains("ver")) cerrarEditor();
    return;
  }
  var qr = document.getElementById("qrpleno");
  if (qr){ if (ev.key === "Escape" || ev.key === "q" || ev.key === "Q") qr.parentNode.removeChild(qr); return; }
  if (!esCampo && (ev.key === "e" || ev.key === "E")){ ev.preventDefault(); abrirEditor(); return; }
  if (!esCampo && (ev.key === "q" || ev.key === "Q")){ ev.preventDefault(); pantallaQR(); return; }
  if (document.getElementById("ganador").classList.contains("ver")){ ev.preventDefault(); cerrarGanador(); return; }
  if (ev.key === "Enter" && esCampo){ ev.target.blur(); return; }
  if (esCampo) return;
  if (ev.key === " " || ev.key === "ArrowRight" || ev.key === "PageDown"){ ev.preventDefault(); mover(1); }
  if (ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); mover(-1); }
  if (ev.key === "Home"){ ev.preventDefault(); mover(-999); }
  if (ev.key === "End"){ ev.preventDefault(); mover(999); }
  if (ev.key === "f" || ev.key === "F"){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
});

  }).join("");

function formPregunta(mi, qi){
  var nueva = (qi === null);
  var q = nueva ? { tema:"", pregunta:"", opciones:["","",""], correcta:0, porque:"" }
                : JSON.parse(JSON.stringify(MODULOS[mi].preguntas[qi]));
  function leer(){
    q.tema = document.getElementById("fTema").value.trim();
    q.pregunta = document.getElementById("fPreg").value.trim();
    q.porque = document.getElementById("fPorque").value.trim();
    q.opciones = [].map.call(formCaja.querySelectorAll(".fOp"), function(x){ return x.value.trim(); });
    var r = formCaja.querySelector('input[name=fCorr]:checked');
    q.correcta = r ? +r.value : 0;
    var ep = document.getElementById("fEpi"); if (ep) q.epigrafe = ep.value.trim();
  }
  function pintar(){
    formCaja.innerHTML =
      '<h3>' + (nueva ? "Pregunta nueva" : "Editar pregunta") + ' — ' + esc(MODULOS[mi].tema) + '</h3>' +
      '<label>Subtema (aparece arriba a la derecha)</label>' +
      '<input type="text" id="fTema" value="' + esc(q.tema) + '" placeholder="Ej.: Tren delantero">' +
      '<label>Enunciado</label>' +
      '<textarea id="fPreg" placeholder="Escribí la pregunta">' + esc(q.pregunta) + '</textarea>' +
      '<label>Opciones — marcá la correcta</label>' +
      q.opciones.map(function(op, i){
        return '<div class="fila-op"><input type="radio" name="fCorr" value="' + i + '"' + (i === q.correcta ? " checked" : "") + '>' +
          '<span class="letra">' + LETRAS[i] + '</span>' +
          '<input type="text" class="fOp" value="' + esc(op) + '" placeholder="Texto de la opción">' +
          (q.opciones.length > 2 ? '<button type="button" class="baja" data-quita="' + i + '">✕</button>' : '') + '</div>';
      }).join("") +
      (q.opciones.length < 7 ? '<button type="button" id="fMas" style="margin-top:.6vh">+ Agregar opción</button>' : '') +
      '<label>Por qué (se muestra en la lámina de respuesta)</label>' +
      '<textarea id="fPorque" placeholder="La explicación de la respuesta correcta">' + esc(q.porque || "") + '</textarea>' +
      '<label>Gráfico (opcional)</label>' +
      '<div class="fimg">' + (q.imagen ? '<img src="' + q.imagen + '" alt="">' +
          '<button type="button" class="baja" id="fSinImg">Quitar gráfico</button>' : '') +
        '<input type="file" id="fImg" accept="image/*"></div>' +
      (q.imagen ? '<label>Epígrafe del gráfico</label><input type="text" id="fEpi" value="' + esc(q.epigrafe || "") + '">' : '') +
      '<p class="aviso" id="fAviso"></p>' +
      '<div class="pieform"><button type="button" class="pri" id="fGuardar">Guardar</button>' +
        '<button type="button" id="fCancelar">Cancelar</button></div>';

    formCaja.querySelectorAll("[data-quita]").forEach(function(b){
      b.addEventListener("click", function(){
        leer(); q.opciones.splice(+b.dataset.quita, 1);
        if (q.correcta >= q.opciones.length) q.correcta = 0;
        pintar();
      });
    });
    var mas = document.getElementById("fMas");
    if (mas) mas.addEventListener("click", function(){ leer(); q.opciones.push(""); pintar(); });
    var sin = document.getElementById("fSinImg");
    if (sin) sin.addEventListener("click", function(){ leer(); delete q.imagen; delete q.epigrafe; pintar(); });
    document.getElementById("fImg").addEventListener("change", function(ev){
      var f = ev.target.files && ev.target.files[0]; if (!f) return;
      leer();
      var lector = new FileReader();
      lector.onload = function(){ achicar(lector.result, function(url){ q.imagen = url; pintar(); }); };
      lector.readAsDataURL(f);
    });
    document.getElementById("fCancelar").addEventListener("click", function(){ elForm.classList.remove("ver"); });
    document.getElementById("fGuardar").addEventListener("click", function(){
      leer();
      var av = document.getElementById("fAviso");
      if (!q.pregunta){ av.textContent = "Falta el enunciado."; return; }
      if (q.opciones.filter(function(o){ return o; }).length < 2){ av.textContent = "Hacen falta al menos dos opciones con texto."; return; }
      if (!q.opciones[q.correcta]){ av.textContent = "La opción marcada como correcta está vacía."; return; }
      var quedan = [], nuevaCorr = 0;
      q.opciones.forEach(function(o, i){
        if (o || i === q.correcta){ if (i === q.correcta) nuevaCorr = quedan.length; quedan.push(o); }
      });
      q.opciones = quedan; q.correcta = nuevaCorr;
      if (nueva) MODULOS[mi].preguntas.push(q); else MODULOS[mi].preguntas[qi] = q;
      elForm.classList.remove("ver");
      pintarLista();
    });
  }
  pintar();
  elForm.classList.add("ver");
}
/* achica la foto para que el archivo no crezca de más */
function achicar(url, cb){
  var im = new Image();
  im.onload = function(){
    var w = Math.min(1600, im.width), h = Math.round(im.height * w / im.width);
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,w,h); x.drawImage(im, 0, 0, w, h);
    cb(c.toDataURL("image/jpeg", .82));
  };
  im.onerror = function(){ cb(url); };
  im.src = url;
}

function formModulo(mi){
  var nuevo = (mi === null);
  var m = nuevo ? { tema:"", bajada:"" } : { tema:MODULOS[mi].tema, bajada:MODULOS[mi].bajada };
  formCaja.innerHTML = '<h3>' + (nuevo ? "Módulo nuevo" : "Editar módulo") + '</h3>' +
    '<label>Nombre del módulo</label><input type="text" id="mTema" value="' + esc(m.tema) + '" placeholder="Ej.: Motor">' +
    '<label>Bajada (texto chico de la lámina de presentación)</label>' +
    '<input type="text" id="mBaj" value="' + esc(m.bajada || "") + '">' +
    '<p class="aviso" id="mAviso"></p>' +
    '<div class="pieform"><button type="button" class="pri" id="mGuardar">Guardar</button>' +
    '<button type="button" id="mCancelar">Cancelar</button></div>';
  document.getElementById("mCancelar").addEventListener("click", function(){ elForm.classList.remove("ver"); });
  document.getElementById("mGuardar").addEventListener("click", function(){
    var t = document.getElementById("mTema").value.trim();
    if (!t){ document.getElementById("mAviso").textContent = "Falta el nombre del módulo."; return; }
    var b = document.getElementById("mBaj").value.trim();
    if (nuevo) MODULOS.push({ tema:t, bajada:b, preguntas:[] }); else { MODULOS[mi].tema = t; MODULOS[mi].bajada = b; }
    elForm.classList.remove("ver"); pintarLista();
  });
  elForm.classList.add("ver");
}
function formJornada(){
  formCaja.innerHTML = '<h3>Carátula de la jornada</h3>' +
    '<label>Rótulo</label><input type="text" id="jRot" value="' + esc(JORNADA.rotulo) + '">' +
    '<label>Título</label><input type="text" id="jTit" value="' + esc(JORNADA.titulo) + '">' +
    '<label>Lugar</label><input type="text" id="jLug" value="' + esc(JORNADA.lugar) + '">' +
    '<label>Año</label><input type="text" id="jAn" value="' + esc(JORNADA.anio) + '">' +
    '<div class="pieform"><button type="button" class="pri" id="jGuardar">Guardar</button>' +
    '<button type="button" id="jCancelar">Cancelar</button></div>';
  document.getElementById("jCancelar").addEventListener("click", function(){ elForm.classList.remove("ver"); });
  document.getElementById("jGuardar").addEventListener("click", function(){
    JORNADA.rotulo = document.getElementById("jRot").value.trim();
    JORNADA.titulo = document.getElementById("jTit").value.trim();
    JORNADA.lugar  = document.getElementById("jLug").value.trim();
    JORNADA.anio   = document.getElementById("jAn").value.trim();
    elForm.classList.remove("ver");
  });
  elForm.classList.add("ver");
}
edLista.addEventListener("click", function(ev){
  var b = ev.target.closest("button"); if (!b) return;
  var d = b.dataset, par;
  if (d.nueva   !== undefined){ formPregunta(+d.nueva, null); return; }
  if (d.ed      !== undefined){ par = d.ed.split(","); formPregunta(+par[0], +par[1]); return; }
  if (d.borra   !== undefined){ par = d.borra.split(",");
    if (confirm("¿Borrar esta pregunta?")){ MODULOS[+par[0]].preguntas.splice(+par[1], 1); pintarLista(); } return; }
  if (d.sube    !== undefined){ par = d.sube.split(","); mueve(MODULOS[+par[0]].preguntas, +par[1], -1); pintarLista(); return; }
  if (d.baja    !== undefined){ par = d.baja.split(","); mueve(MODULOS[+par[0]].preguntas, +par[1], 1); pintarLista(); return; }
  if (d.moded   !== undefined){ formModulo(+d.moded); return; }
  if (d.modsube !== undefined){ mueve(MODULOS, +d.modsube, -1); pintarLista(); return; }
  if (d.modbaja !== undefined){ mueve(MODULOS, +d.modbaja, 1); pintarLista(); return; }
  if (d.modborra!== undefined){
    if (confirm("¿Borrar el módulo «" + MODULOS[+d.modborra].tema + "» y todas sus preguntas?")){ MODULOS.splice(+d.modborra, 1); pintarLista(); }
  }
});
function mueve(arr, i, d){ var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

function descargar(){
  var copia = document.documentElement.cloneNode(true);
  ["#app","#formCaja","#edLista"].forEach(function(s){ copia.querySelector(s).innerHTML = ""; });
  ["#editor","#form","#ganador"].forEach(function(s){ copia.querySelector(s).classList.remove("ver"); });
  [".chip","#qrpleno"].forEach(function(s){ var x = copia.querySelector(s); if (x) x.parentNode.removeChild(x); });
  copia.querySelector("#datos").textContent = "\n" + JSON.stringify({ jornada:JORNADA, modulos:MODULOS }, null, 1) + "\n";
  copia.querySelector("body").className = "";
  var html = "<!DOCTYPE html>\n" + copia.outerHTML;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], {type:"text/html;charset=utf-8"}));
  a.download = "pulsador.html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
document.getElementById("btnEditar").addEventListener("click", abrirEditor);
document.getElementById("edCerrar").addEventListener("click", cerrarEditor);
document.getElementById("edNuevoMod").addEventListener("click", function(){ formModulo(null); });
document.getElementById("edJornada").addEventListener("click", formJornada);
document.getElementById("edDescargar").addEventListener("click", descargar);
