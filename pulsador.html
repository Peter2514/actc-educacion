<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pulsador ACTC</title>
<style>
:root{
  --fondo:#0B0C0E; --card:#17181C; --borde:#34363E; --badge:#2A2C33;
  --gris:#9A9CA4; --verde:#1DB954; --verde-osc:#0E7B37;
  --rojo:#E03131; --ambar:#F0A400; --oro:#F2C14E;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fondo);font-family:Arial,Helvetica,sans-serif;color:#fff;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:26px 26px;
}
#app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;
  padding:20px 16px 24px;gap:18px}

.marca{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto}
.marca img{height:46px;width:auto;display:block}
.marca .rot{text-align:right;line-height:1.3}
.marca .rot b{display:block;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.marca .rot span{display:block;font-size:12px;color:var(--gris)}

h1{font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px;line-height:1.25}
p.sub{color:var(--gris);font-size:15px;line-height:1.45;max-width:62ch}

.centro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:0}

label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gris);font-weight:700;margin-bottom:8px}
input[type=text]{
  width:100%;background:var(--card);border:1.5px solid var(--borde);border-radius:12px;
  color:#fff;font-family:inherit;font-size:20px;padding:16px 14px;outline:none}
input[type=text]:focus{border-color:var(--verde)}
input.codigo{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:700}

button{font-family:inherit;cursor:pointer;border-radius:12px;font-size:16px;
  padding:14px 18px;background:var(--card);border:1.5px solid var(--borde);color:#fff;
  touch-action:manipulation}
button:hover{border-color:#5A5E6A}
button.pri{background:var(--verde);border-color:var(--verde);color:#06140C;font-weight:700}
button.amb{background:var(--ambar);border-color:var(--ambar);color:#12161A;font-weight:700}
button.fantasma{background:transparent;color:var(--gris)}
button[disabled]{opacity:.45;cursor:default}
.fila{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- botón gigante del alumno ---------- */
.pulsar{
  width:100%;aspect-ratio:1/1;max-height:52vh;max-width:min(100%,420px);margin:0 auto;
  border-radius:50%;font-size:40px;font-weight:700;letter-spacing:.04em;
  background:var(--verde);border:none;color:#06140C;
  box-shadow:0 0 0 10px rgba(29,185,84,.16), 0 18px 40px rgba(0,0,0,.5);
  transition:transform .06s, box-shadow .18s, background .18s;
}
.pulsar:active{transform:scale(.97)}
.pulsar[disabled]{background:#2A2C33;color:#6A6E78;box-shadow:none;opacity:1}
.pulsar.espera{background:#2A2C33;color:var(--gris);box-shadow:none}

.puesto{text-align:center}
.puesto .n{font-size:84px;font-weight:700;line-height:1;letter-spacing:-.04em}
.puesto .n.top{color:var(--verde)}
.puesto .t{font-size:17px;color:var(--gris);margin-top:8px}

/* ---------- tablero del docente ---------- */
.tablero{display:flex;flex-direction:column;gap:10px}
.puesto-fila{
  display:flex;align-items:center;gap:14px;background:var(--card);
  border:1.5px solid var(--borde);border-radius:14px;padding:14px 16px;
}
.puesto-fila .pos{
  flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--badge);
  display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.puesto-fila .nom{flex:1;font-size:20px;font-weight:700;overflow-wrap:anywhere}
.puesto-fila .dif{font-size:14px;color:var(--gris);font-variant-numeric:tabular-nums;white-space:nowrap}
.puesto-fila.p1{border-color:var(--verde);background:rgba(29,185,84,.12)}
.puesto-fila.p1 .pos{background:var(--verde);color:#06140C}
.puesto-fila.p1 .nom{font-size:26px}
.puesto-fila.p2 .pos,.puesto-fila.p3 .pos{background:#3A3D45}
.puesto-fila.resto{padding:10px 14px;opacity:.72}
.puesto-fila.resto .pos{width:34px;height:34px;font-size:15px}
.puesto-fila.resto .nom{font-size:16px;font-weight:400}

.vacio{border:1.5px dashed var(--borde);border-radius:14px;padding:26px 16px;
  text-align:center;color:var(--gris);font-size:16px}

/* ---------- QR ---------- */
.qrcaja{background:#fff;padding:14px;border-radius:14px;display:inline-block;line-height:0}
.qrcaja img,.qrcaja canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrzona{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.qrzona .qrcaja{flex:0 0 auto;width:min(46vw,230px)}
.qrzona .datos{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.codigo-grande{font-size:46px;font-weight:700;letter-spacing:.14em;color:var(--oro);line-height:1}
.urlchica{font-size:13px;color:var(--gris);overflow-wrap:anywhere}

.estado{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris)}
.luz{width:9px;height:9px;border-radius:50%;background:var(--gris);flex:0 0 auto}
.luz.ok{background:var(--verde)}
.luz.mal{background:var(--rojo)}

.aviso{background:rgba(224,49,49,.12);border:1.5px solid #7A1512;border-radius:12px;
  padding:14px;font-size:14px;line-height:1.5}
.nota{font-size:13px;color:var(--gris);line-height:1.5}
pre{background:#101216;border:1.5px solid var(--borde);border-radius:12px;padding:14px;
  overflow-x:auto;font-size:12px;line-height:1.5;color:#D6D8DE}
ol.pasos{margin-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}
ol.pasos code{background:#101216;border:1px solid var(--borde);border-radius:6px;padding:1px 6px;font-size:13px}

#qrpleno{position:fixed;inset:0;z-index:90;background:var(--fondo);
  display:flex;align-items:center;justify-content:center;padding:4vh 4vw}
.qrpleno-caja{display:flex;flex-direction:column;align-items:center;gap:1.6vh}
.qrpleno-caja .qrcaja{width:min(48vh,80vw);padding:2vh}
.qrpleno-cod{font-size:min(10vh,17vw);font-weight:700;letter-spacing:.12em;
  color:var(--oro);line-height:1}
.qrpleno-o{font-size:min(3vh,20px);color:var(--gris);text-align:center;margin-top:-.8vh}
.qrpleno-dir{font-size:min(5.4vh,34px);font-weight:700;color:#fff;text-align:center;
  overflow-wrap:anywhere;line-height:1.15;max-width:92vw}

@media (min-width:760px){
  #app{padding:28px 40px 34px;max-width:1100px;margin:0 auto;width:100%}
  h1{font-size:44px}
  .marca img{height:56px}
  .puesto-fila .nom{font-size:24px}
  .puesto-fila.p1 .nom{font-size:34px}
  .codigo-grande{font-size:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app"></div>

/* ═══════════════ conexión con la base ═══════════════
   Dos implementaciones con la misma interfaz:
     escribir(ruta, valor)  -> Promise
     escuchar(ruta, cb)     -> función para cortar
   NUBE usa Firebase por REST (sin librerías).
   ENSAYO usa el propio navegador, para practicar sin base.          */

var HORA = { ".sv": "timestamp" };

var NUBE = {
  nombre: "nube",
  escribir: function(ruta, valor){
    return fetch(BASE + "/" + ruta + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(valor)
    }).then(function(r){
      if (!r.ok) return r.text().then(function(t){ throw new Error(t || ("HTTP " + r.status)); });
      return r.json();
    });
  },
  leer: function(ruta){
    return fetch(BASE + "/" + ruta + ".json", { cache: "no-store" })
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      });
  },
  escuchar: function(ruta, cb){
    var url = BASE + "/" + ruta + ".json", muerto = false, fuente = null, reloj = null;

    function sondear(){
      fetch(url, { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(v){ if (!muerto) cb(v, true); })
        .catch(function(){ if (!muerto) cb(undefined, false); });
    }
    function aSondeo(){
      if (reloj) return;
      sondear();
      reloj = setInterval(sondear, 1500);
    }

    if (typeof EventSource !== "undefined"){
      try{
        fuente = new EventSource(url);
        var estado = null;
        fuente.addEventListener("put", function(ev){
          var d = JSON.parse(ev.data);
          if (d.path === "/") estado = d.data;
          else estado = ponerEn(estado, d.path, d.data);
          cb(estado, true);
        });
        fuente.addEventListener("patch", function(ev){
          var d = JSON.parse(ev.data);
          var base = d.path === "/" ? estado : null;
          if (d.path === "/"){
            estado = estado || {};
            for (var k in d.data) estado[k] = d.data[k];
          } else {
            estado = ponerEn(estado, d.path, d.data);
          }
          cb(estado, true);
        });
        fuente.onerror = function(){
          /* si el navegador o la red no banca el streaming, pasamos a sondeo */
          if (fuente && fuente.readyState === 2){ try{ fuente.close(); }catch(e){} fuente = null; aSondeo(); }
        };
      }catch(e){ aSondeo(); }
    } else {
      aSondeo();
    }

    return function(){
      muerto = true;
      if (fuente) try{ fuente.close(); }catch(e){}
      if (reloj) clearInterval(reloj);
    };
  }
};

function ponerEn(estado, ruta, valor){
  var partes = ruta.split("/").filter(Boolean);
  if (!partes.length) return valor;
  if (estado == null || typeof estado !== "object") estado = {};
  var copia = {}, k;
  for (k in estado) copia[k] = estado[k];
  var cur = copia;
  for (var i=0;i<partes.length-1;i++){
    var sig = cur[partes[i]];
    cur[partes[i]] = (sig && typeof sig === "object") ? clonar(sig) : {};
    cur = cur[partes[i]];
  }
  if (valor === null) delete cur[partes[partes.length-1]];
  else cur[partes[partes.length-1]] = valor;
  return copia;
}
function clonar(o){ var c = {}; for (var k in o) c[k] = o[k]; return c; }

/* --- modo ensayo: todo dentro de este navegador --- */
var ENSAYO = (function(){
  var LLAVE = "pulsador.ensayo";
  var oyentes = [];
  function todo(){ try{ return JSON.parse(leerLocal(LLAVE) || "{}"); }catch(e){ return {}; } }
  function bajar(obj, ruta){
    var p = ruta.split("/").filter(Boolean), cur = obj;
    for (var i=0;i<p.length;i++){
      if (cur == null || typeof cur !== "object") return null;
      cur = cur[p[i]];
    }
    return cur === undefined ? null : cur;
  }
  function avisar(){
    var raiz = todo();
    oyentes.forEach(function(o){ o.cb(bajar(raiz, o.ruta), true); });
  }
  try{
    window.addEventListener("storage", function(ev){ if (ev.key === LLAVE) avisar(); });
  }catch(e){}
  return {
    nombre: "ensayo",
    escribir: function(ruta, valor){
      var raiz = todo();
      /* misma regla que en la base: en pulsos se crea, nunca se pisa */
      if (/^salas\/[^/]+\/pulsos\/[^/]+\/[^/]+$/.test(ruta)){
        var p0 = ruta.split("/"), cur0 = raiz, hay = true;
        for (var j=0;j<p0.length;j++){
          if (!cur0 || typeof cur0 !== "object" || cur0[p0[j]] === undefined){ hay = false; break; }
          cur0 = cur0[p0[j]];
        }
        if (hay) return Promise.reject(new Error("ya respondiste"));
      }
      var v = (valor && valor[".sv"] === "timestamp") ? Date.now() : valor;
      if (v && typeof v === "object"){
        v = JSON.parse(JSON.stringify(v));
        for (var k in v) if (v[k] && v[k][".sv"] === "timestamp") v[k] = Date.now();
      }
      var p = ruta.split("/").filter(Boolean), cur = raiz;
      for (var i=0;i<p.length-1;i++){
        if (!cur[p[i]] || typeof cur[p[i]] !== "object") cur[p[i]] = {};
        cur = cur[p[i]];
      }
      cur[p[p.length-1]] = v;
      guardar(LLAVE, JSON.stringify(raiz));
      setTimeout(avisar, 0);
      return Promise.resolve(v);
    },
    leer: function(ruta){
      return Promise.resolve(bajar(todo(), ruta));
    },
    escuchar: function(ruta, cb){
      var o = { ruta: ruta, cb: cb };
      oyentes.push(o);
      setTimeout(function(){ cb(bajar(todo(), ruta), true); }, 0);
      return function(){ oyentes = oyentes.filter(function(x){ return x !== o; }); };
    }
  };
})();

function seleccionar(el){
  try{
    var r = document.createRange(); r.selectNodeContents(el);
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }catch(e){}
}

function pantallaInicio(){
  app.innerHTML = marca() +
    '<div class="centro">' +
      '<div>' +
        '<h1>Pulsador de respuestas</h1>' +
        '<p class="sub">Poné el código que está en la pantalla del aula.</p>' +
      '</div>' +
      '<div>' +
        '<label for="cod">Código de la sala</label>' +
        '<input type="text" id="cod" class="codigo" maxlength="4" placeholder="XXXX" ' +
          'autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
          'inputmode="text" enterkeyhint="go">' +
        '<div class="fila" style="margin-top:12px">' +
          '<button class="pri" id="entrar" style="flex:1">Entrar</button></div>' +
      '</div>' +
      '<div style="text-align:center;margin-top:8px">' +
        '<button class="fantasma" id="crear" style="font-size:14px">Soy el profe: crear una sala</button>' +
      '</div>' +
    '</div>' +
    (ENSAYANDO ? '<p class="nota">Modo ensayo: todo queda en este navegador. ' +
      'Para simular alumnos, abrí pestañas con <b>&amp;yo=Carlos</b>, <b>&amp;yo=Pedro</b>, etc.</p>' : '');

  $("#crear").addEventListener("click", function(){
    ir(codigoNuevo(), true);
  });
  $("#entrar").addEventListener("click", entrar);
  $("#cod").addEventListener("keydown", function(ev){ if (ev.key === "Enter") entrar(); });
  function entrar(){
    var c = ($("#cod").value || "").toUpperCase().replace(/[^A-Z0-9]/g,"");
    if (c.length === 4) ir(c, false);
    else $("#cod").focus();
  }
}
function ir(sala, docente){
  var u = location.pathname + "?s=" + sala + (docente ? "&d=1" : "") + (ENSAYANDO ? "&ensayo=1" : "");
  location.href = u;
}

/* ---- QR a pantalla completa, para que lo vean desde el fondo ---- */
function pantallaQR(){
  var caja = document.createElement("div");
  caja.id = "qrpleno";
  caja.innerHTML =
    '<div class="qrpleno-caja">' +
      '<div class="qrcaja" id="qrgrande"></div>' +
      '<div class="qrpleno-o">o entrá a</div>' +
      '<div class="qrpleno-dir">' + esc(urlCorta()) + '</div>' +
      '<div class="qrpleno-o">y poné el código</div>' +
      '<div class="qrpleno-cod">' + esc(SALA_ACTUAL) + '</div>' +
      '<button id="cerrarqr">Volver al tablero</button>' +
    '</div>';
  document.body.appendChild(caja);
  dibujarQR(caja.querySelector("#qrgrande"), urlAlumno(SALA_ACTUAL));
  function cerrar(){ if (caja.parentNode) caja.parentNode.removeChild(caja); }
  caja.querySelector("#cerrarqr").addEventListener("click", cerrar);
  caja.addEventListener("click", function(ev){ if (ev.target === caja) cerrar(); });
}

/* ---------------- alumno ----------------
   Con 200 o 300 teléfonos no podemos dejar una conexión abierta por
   alumno: el plan gratis banca 100 a la vez. Así que el alumno NO se
   queda escuchando: pregunta cada tres o cuatro segundos y corta.
   Cada pregunta trae un número de un dígito, no la lista de todos.   */
function pantallaAlumno(sala){
  var nombre = YO || leerLocal("pulsador.nombre") || "";
  if (!nombre) return pedirNombre(sala);

  var uid = miId();
  var ronda = null, yaPulse = false, podio = null, enviando = false;
  var reloj = null, vivo = true;

  app.innerHTML = marca() +
    '<div class="centro">' +
      '<div style="text-align:center">' +
        '<h2 id="hola">Hola, ' + esc(nombre) + '</h2>' +
        '<p class="sub" id="pie" style="margin:8px auto 0;text-align:center">Buscando la sala…</p>' +
      '</div>' +
      '<button class="pulsar espera" id="boton" disabled>ESPERÁ</button>' +
      '<div class="puesto" id="puesto"></div>' +
    '</div>' +
    '<div class="estado"><span class="luz" id="luz"></span><span id="txtluz">Conectando…</span>' +
      '<span style="flex:1"></span>' +
      (YO ? '' : '<button class="fantasma" id="cambiar" style="padding:6px 10px;font-size:13px">Cambiar nombre</button>') +
      '</div>';

  if (!YO) $("#cambiar").addEventListener("click", function(){
    guardar("pulsador.nombre","");
    vivo = false; if (reloj) clearTimeout(reloj);
    pedirNombre(sala);
  });

  var boton = $("#boton");
  boton.addEventListener("click", pulsar);

  function luz(ok){
    var l = $("#luz"), t = $("#txtluz");
    if (!l) return;
    l.className = "luz " + (ok ? "ok" : "mal");
    t.textContent = ok ? ("Sala " + sala + (ENSAYANDO ? " · ensayo" : "")) : "Sin señal, reintentando…";
  }

  function otraVuelta(){
    if (!vivo) return;
    /* con un poco de azar para que no consulten todos en el mismo instante */
    reloj = setTimeout(ciclo, 3000 + Math.floor(Math.random() * 1600));
  }

  function ciclo(){
    if (!vivo) return;
    DB.leer("salas/" + sala + "/ronda").then(function(v){
      luz(true);
      if (v == null){
        $("#pie").textContent = "Esa sala no existe todavía.";
        boton.disabled = true; boton.className = "pulsar espera"; boton.textContent = "—";
        otraVuelta(); return;
      }
      if (v !== ronda){                       /* arrancó una pregunta nueva */
        ronda = v; yaPulse = false; podio = null;
        pintar();
      }
      if (yaPulse && !podio){
        DB.leer("salas/" + sala + "/podio/" + ronda).then(function(pp){
          if (pp){ podio = pp; pintar(); }
          otraVuelta();
        }, function(){ otraVuelta(); });
        return;
      }
      pintar();
      otraVuelta();
    }, function(){
      luz(false);
      otraVuelta();
    });
  }

  function miPuesto(){
    if (!podio) return 0;
    for (var k = 1; k <= 5; k++){
      if (podio[k] && podio[k].id === uid) return k;
    }
    return -1;                                 /* hubo podio y no estoy */
  }

  function pintar(){
    if (ronda == null) return;
    var caja = $("#puesto");

    if (!yaPulse){
      boton.disabled = enviando;
      boton.className = "pulsar";
      boton.textContent = enviando ? "…" : "RESPONDO";
      $("#pie").textContent = "Cuando sepas la respuesta, tocá el botón.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + '</div>';
      return;
    }

    boton.disabled = true;
    boton.className = "pulsar";
    boton.textContent = "LISTO";

    var p = miPuesto();
    if (p === 0){
      $("#pie").textContent = "Respuesta registrada. Mirá la pantalla.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + ' · esperando el resultado</div>';
    } else if (p > 0){
      $("#pie").textContent = "¡Entraste en el podio!";
      caja.innerHTML = '<div class="n top">' + p + 'º</div>' +
        '<div class="t">' + (p === 1 ? '¡Fuiste el primero!' : 'Entraste ' + p + 'º.') + '</div>';
    } else {
      $("#pie").textContent = "Esta vez no llegaste. Va la próxima.";
      caja.innerHTML = '<div class="t">Pregunta ' + ronda + ' · fuera del podio</div>';
    }
  }

  function pulsar(){
    if (enviando || ronda == null || yaPulse) return;
    enviando = true; pintar();
    DB.escribir("salas/" + sala + "/pulsos/" + ronda + "/" + uid, { n: nombre, t: HORA })
      .then(function(){ enviando = false; yaPulse = true; pintar(); })
      .catch(function(){
        /* si la base lo rechaza es porque ya había respondido */
        enviando = false; yaPulse = true; pintar();
      });
  }

  ciclo();
}

function pedirNombre(sala){
  app.innerHTML = marca() +
    '<div class="centro">' +
      '<div>' +
        '<h1>¿Cómo te llamás?</h1>' +
        '<p class="sub">Es para que el profe te vea en la lista. Se guarda en tu teléfono, ' +
        'no hace falta escribirlo de nuevo.</p>' +
      '</div>' +
      '<div>' +
        '<label for="nom">Tu nombre</label>' +
        '<input type="text" id="nom" maxlength="30" placeholder="Nombre y apellido" ' +
          'autocomplete="name" autocapitalize="words">' +
      '</div>' +
      '<div class="fila"><button class="pri" id="listo">Listo</button></div>' +
    '</div>';
  var campo = $("#nom");
  campo.value = leerLocal("pulsador.nombre") || "";
  campo.focus();
  function ok(){
    var v = (campo.value || "").trim().slice(0,30);
    if (!v){ campo.focus(); return; }
    guardar("pulsador.nombre", v);
    pantallaAlumno(sala);
  }
  $("#listo").addEventListener("click", ok);
  campo.addEventListener("keydown", function(ev){ if (ev.key === "Enter") ok(); });
}

/* ---------------- docente ---------------- */
var SALA_ACTUAL = "";
function pantallaDocente(sala){
  var ronda = null, pulsos = null, cortar2 = null;
  SALA_ACTUAL = sala;

  app.innerHTML = marca() +
    '<div class="qrzona">' +
      '<div class="qrcaja" id="qr"></div>' +
      '<div class="datos">' +
        '<div><label>Código de la sala</label><div class="codigo-grande">' + esc(sala) + '</div></div>' +
        '<div class="urlchica" id="url"></div>' +
        '<div class="fila">' +
          '<button class="pri" id="podio">Mostrar podio</button>' +
          '<button class="amb" id="nueva">Pregunta siguiente</button>' +
        '</div>' +
        '<div class="fila">' +
          '<button id="agrandar">QR grande</button>' +
          '<button id="otra">Otra sala</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div><h2 id="titulo">Pregunta 1</h2></div>' +
    '<div class="tablero" id="tablero"></div>' +
    '<div class="estado"><span class="luz" id="luz"></span><span id="txtluz">Conectando…</span></div>';

  $("#url").textContent = urlCorta() + "  ·  código " + sala;
  if (!dibujarQR($("#qr"), urlAlumno(sala))){
    $("#qr").outerHTML = '<div class="vacio" style="flex:0 0 auto">No pude dibujar el QR.<br>' +
      'Dictales el código.</div>';
  }
  $("#otra").addEventListener("click", function(){ location.href = location.pathname + (ENSAYANDO ? "?ensayo=1" : ""); });
  $("#agrandar").addEventListener("click", pantallaQR);

  /* publica los cinco primeros para que cada teléfono vea si entró */
  function publicarPodio(){
    if (ronda == null) return Promise.resolve();
    var orden = ordenar();
    if (!orden.length) return Promise.resolve();
    var cinco = {};
    orden.slice(0,5).forEach(function(x, i){ cinco[i+1] = { id: x.id, n: x.n }; });
    return DB.escribir("salas/" + sala + "/podio/" + ronda, cinco).catch(function(){});
  }

  $("#podio").addEventListener("click", function(){
    var b = $("#podio"); b.disabled = true;
    publicarPodio().then(function(){
      b.textContent = "Podio publicado";
      setTimeout(function(){ b.textContent = "Mostrar podio"; b.disabled = false; }, 2500);
    });
  });

  $("#nueva").addEventListener("click", function(){
    if (ronda == null) return;
    var b = $("#nueva"); b.disabled = true;
    publicarPodio().then(function(){
      return DB.escribir("salas/" + sala + "/ronda", ronda + 1);
    }).then(function(){ b.disabled = false; })
      .catch(function(){ b.disabled = false; });
  });

  /* si la sala no existe todavía, la creamos en la ronda 1 */
  var arrancado = false;
  DB.escuchar("salas/" + sala + "/ronda", function(v, ok){
    luz(ok);
    if (v == null && !arrancado){
      arrancado = true;
      DB.escribir("salas/" + sala + "/ronda", 1).catch(function(){});
      return;
    }
    if (v == null) return;
    if (v !== ronda){
      ronda = v;
      pulsos = null;
      if (cortar2) cortar2();
      cortar2 = DB.escuchar("salas/" + sala + "/pulsos/" + ronda, function(p){ pulsos = p; pintar(); });
    }
    pintar();
  });

  function ordenar(){
    if (!pulsos) return [];
    return Object.keys(pulsos).map(function(k){
      return { id:k, n:pulsos[k].n, t:pulsos[k].t };
    }).sort(function(a,b){ return (a.t - b.t) || (a.id < b.id ? -1 : 1); });
  }

  function luz(ok){
    $("#luz").className = "luz " + (ok ? "ok" : "mal");
    $("#txtluz").textContent = ok
      ? ("En vivo" + (ENSAYANDO ? " · ensayo · sumá &yo=Nombre a la dirección del alumno para simular" : ""))
      : "Sin conexión, reintentando…";
  }
  function pintar(){
    if (ronda == null) return;
    $("#titulo").textContent = "Pregunta " + ronda;
    var orden = ordenar();

    var caja = $("#tablero");
    if (!orden.length){
      caja.innerHTML = '<div class="vacio">Nadie respondió todavía.</div>';
      return;
    }
    var t0 = orden[0].t;
    caja.innerHTML = orden.slice(0,5).map(function(x, i){
      var dif = i === 0 ? "" : "+" + ((x.t - t0)/1000).toFixed(2).replace(".",",") + " s";
      return '<div class="puesto-fila ' + (i < 3 ? "p" + (i+1) : "resto") + '">' +
               '<span class="pos">' + (i+1) + 'º</span>' +
               '<span class="nom">' + esc(x.n) + '</span>' +
               '<span class="dif">' + dif + '</span>' +
             '</div>';
    }).join("") +
    (orden.length > 5
      ? '<p class="nota">y ' + (orden.length-5) + ' más (' + orden.length + ' en total).</p>'
      : '<p class="nota">' + orden.length + (orden.length === 1 ? ' respuesta.' : ' respuestas.') + '</p>');
  }
}

/* ═══════════════ arranque ═══════════════ */
(function(){
  var sala = (parametro("s") || "").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4);
  if (!ENSAYANDO && !BASE) return pantallaConfig();
  if (!sala) return pantallaInicio();
  if (parametro("d") === "1") return pantallaDocente(sala);
  return pantallaAlumno(sala);
})();
